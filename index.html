<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot machine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Adventure Spin</h1>
        <p>Balance: <span id="creditBalance">1000$</span></p>

<section class="reels">
    <div class="reel" id="reel1">
        <div class="reel-strip" id="reel1Strip"></div>
    </div>

    <div class="reel" id="reel2">
        <div class="reel-strip" id="reel2Strip"></div>
    </div>

    <div class="reel" id="reel3">
        <div class="reel-strip" id="reel3Strip"></div>
    </div>
</section>

        <label for="betAmount">Bet amount:</label>
        <input type="number" id="betAmount" min="1" step="1">

        <button id="spinButton">Spin</button>
        <button id="resetButton">Reset</button>
        <p id="message"></p>

    </main>




    <script src="scripts.js"></script>
</body>
</html>
